resources:
  apps:
    student_retention_app:
      name: ${bundle.target}-student-retention
      description: Governed student retention decision-support application
      source_code_path: ../app
      lifecycle:
        started: true
      user_api_scopes:
        - dashboards.genie
        - sql
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: postgres
          postgres:
            branch: ${var.lakebase_branch}
            database: ${var.lakebase_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: genie-space
          genie_space:
            name: Student Retention Advisor
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
