resources:
  pipelines:
    student_retention_gold_pipeline:
      name: ${bundle.target}-student-retention-gold-pipeline
      catalog: ${var.catalog}
      target: ${var.schema_prefix}_gold
      root_path: ../src/pipelines
      libraries:
        - file:
            path: ../src/pipelines/intervention_cdc.py
        - file:
            path: ../src/pipelines/gold.py
      serverless: true
      continuous: false
      photon: true
      channel: current
      configuration:
        retention.catalog: ${var.catalog}
        retention.schema_prefix: ${var.schema_prefix}
        retention.warehouse_id: ${var.warehouse_id}
        retention.seed: ${var.retention_seed}
