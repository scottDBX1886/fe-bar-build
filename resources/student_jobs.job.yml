resources:
  jobs:
    student_retention_daily:
      name: ${bundle.target}-student-retention-daily
      parameters:
        - name: run_date
          default: "2026-09-21"
        - name: bootstrap
          default: "true"
      tasks:
        - task_key: generate_synthetic_data
          environment_key: default
          spark_python_task:
            python_file: ../src/synthetic/generate.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema-prefix
              - ${var.schema_prefix}
              - --run-date
              - "{{job.parameters.run_date}}"
              - --seed
              - ${var.retention_seed}
              - --bootstrap
              - "{{job.parameters.bootstrap}}"
        - task_key: run_student_pipeline
          depends_on:
            - task_key: generate_synthetic_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.student_retention_pipeline.id}
            full_refresh: false
        - task_key: train_and_score_stopout_risk
          depends_on:
            - task_key: run_student_pipeline
          environment_key: ml
          spark_python_task:
            python_file: ../src/ml/train.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema-prefix
              - ${var.schema_prefix}
              - --experiment-path
              - ${workspace.root_path}/student-stopout-risk
              - --bundle-root
              - ${workspace.root_path}/files
              - --seed
              - ${var.retention_seed}
        - task_key: bootstrap_gold_governance
          depends_on:
            - task_key: train_and_score_stopout_risk
          environment_key: default
          spark_python_task:
            python_file: ../src/governance/apply.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema-prefix
              - ${var.schema_prefix}
              - --bundle-root
              - ${workspace.root_path}/files
              - --mode
              - bootstrap
        - task_key: run_gold_pipeline
          depends_on:
            - task_key: bootstrap_gold_governance
          pipeline_task:
            pipeline_id: ${resources.pipelines.student_retention_gold_pipeline.id}
            full_refresh: false
        - task_key: apply_gold_core_policies
          depends_on:
            - task_key: run_gold_pipeline
          environment_key: default
          spark_python_task:
            python_file: ../src/governance/apply.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema-prefix
              - ${var.schema_prefix}
              - --bundle-root
              - ${workspace.root_path}/files
              - --mode
              - core-policies
      environments:
        - environment_key: default
          spec:
            client: "4"
        - environment_key: ml
          spec:
            client: "4"
            dependencies:
              - mlflow>=3.1,<4
              - scikit-learn>=1.5,<2
              - xgboost>=2.1,<4
              - shap>=0.46,<1
